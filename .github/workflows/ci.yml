name: CI

on:
  pull_request:
  push:
    branches:
      - modernize
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: '22.16.0'
            node-red: '4.1.13'
          - node: '22'
            node-red: '4.1.16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reconstruct and hash-check the original rc.2 migration fixture.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:package
        env:
          NODE_RED_TEST_VERSION: ${{ matrix.node-red }}
      - run: npm run test:migration
        env:
          NODE_RED_TEST_VERSION: ${{ matrix.node-red }}
