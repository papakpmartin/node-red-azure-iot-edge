name: CI

on:
  pull_request:
  push:
    branches:
      - modernize
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:package
