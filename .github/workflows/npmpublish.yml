name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to qualify without publishing (for example v1.0.0-rc.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0 # Original rc.2 migration baseline is verified from history.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global npm@11.21.1
      - name: Verify source version and npm availability
        run: npm run release:check
        env:
          CHECK_NPM_VERSION: '1'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Pack candidate once
        run: npm run pack:release
      - name: Verify packed version and checksum
        id: artifact
        run: npm run release:check -- dist
      - name: Qualify the exact packed artifact
        run: npm run test:package -- "./dist/$FILENAME"
        env:
          FILENAME: ${{ steps.artifact.outputs.filename }}
      - name: Exercise publication without publishing
        run: npm publish "./dist/$FILENAME" --dry-run --ignore-scripts --access public --tag next
        env:
          FILENAME: ${{ steps.artifact.outputs.filename }}
      - name: Qualify legacy upgrade and rollback
        run: npm run test:migration -- "./dist/$FILENAME"
        env:
          FILENAME: ${{ steps.artifact.outputs.filename }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*
          if-no-files-found: error

  publish-npm:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Verify exact artifact and release identity
        id: release
        run: npm run release:check -- dist
        env:
          CHECK_NPM_VERSION: '1'
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - name: Publish tested artifact using npm trusted publishing
        run: npm publish "./dist/$FILENAME" --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          FILENAME: ${{ steps.release.outputs.filename }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
